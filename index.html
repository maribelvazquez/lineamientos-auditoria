<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mapa mental interactivo de los Lineamientos del Informe de Auditoría PLD/FT (CNBV, DOF 2021) con simulador de reactivos.">
<title>Mapa de Lineamientos de Auditoría PLD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* =====================================================================
   PLANTILLA · Mapa interactivo 360Educa (motor fijo)
   No se edita por bibliografía: todo el contenido vive en <script id="datos">.
   Paleta: color madre por ruta (curso-360educa §6) + paleta ampliada para mapas: verde, morado, turquesa, azul, coral (botones), negro y gris. Tipografía: §7.
   ===================================================================== */
:root{
  --principal:#64c27b; --principal-ink:#1b1b1e; --principal-linea:#64c27b; --principal-halo:rgba(100,194,123,.22);
  --coral:#ff8361; --membrete:#87d895;
  --crema:#faf5ec; --oscuro:#393e41; --negro:#1b1b1e; --gris:#4d4d4d;
  --bg:var(--crema); --surface:#ffffff; --surface-2:var(--crema); --ink:var(--negro); --muted:var(--gris);
  --line:rgba(57,62,65,.16);
  --shadow:0 1px 2px rgba(57,62,65,.06),0 6px 20px rgba(57,62,65,.08);
  --f-display:"Space Grotesk",Arial,system-ui,sans-serif;
  --f-body:"Inter",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-ruta="av"]{--principal:#a663cc;--principal-ink:#1b1b1e;--principal-linea:#a663cc;--principal-halo:rgba(166,99,204,.22)}
:root[data-ruta="transversal"]{--principal:#4a86d8;--principal-ink:#1b1b1e;--principal-linea:#4a86d8;--principal-halo:rgba(74,134,216,.22)}
:root[data-ruta="gratuito"]{--principal:#ffb59d;--principal-ink:#1b1b1e;--principal-linea:#d9663f;--principal-halo:rgba(255,181,157,.35)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.08;color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:6px}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* paleta ampliada para mapas (colores del manual de 360Educa): el principal sale de la ruta; los demás se usan libres */
.c-principal{--c:var(--principal);--ci:var(--principal-ink);--cl:var(--principal-linea)}
.c-verde{--c:#64c27b;--ci:#1b1b1e;--cl:#64c27b}
.c-morado{--c:#a663cc;--ci:#1b1b1e;--cl:#a663cc}
.c-turquesa{--c:#2f9e93;--ci:#1b1b1e;--cl:#2f9e93}
.c-azul{--c:#4a86d8;--ci:#1b1b1e;--cl:#4a86d8}
.c-gris{--c:var(--gris);--ci:#ffffff;--cl:var(--gris)}
.c-oscuro{--c:var(--oscuro);--ci:#ffffff;--cl:var(--oscuro)}
.c-negro{--c:var(--negro);--ci:#ffffff;--cl:var(--negro)}

/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,245,236,.94);backdrop-filter:blur(8px);padding-block:10px;margin-inline:-16px;padding-inline:16px;border-bottom:4px solid var(--membrete)}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.02em}
.ruta{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:none;letter-spacing:.02em;color:var(--ink);font-size:13px}
.ruta::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--principal);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--principal-linea)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
nav.tabs a{text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a:hover{border-color:var(--oscuro)}
nav.tabs a.cta{background:var(--coral);border-color:var(--coral);color:var(--negro);font-weight:700}
.recite-btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:2px solid var(--coral);background:transparent;cursor:pointer}
.recite-btn[aria-pressed="true"]{background:var(--coral);color:var(--negro)}

/* portada */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;padding-block:36px 20px}
.hero h1{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.02em;margin-top:10px}
.hero h1 mark{background:var(--principal);color:var(--principal-ink);padding:0 .18em;border-radius:.12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{color:var(--muted);max-width:60ch;margin:14px 0 0}
.rhythm{display:flex;gap:10px;align-items:stretch}
.rh{flex:1;border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--c);color:var(--ci)}
.rh .big{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,5vw,58px);line-height:1}
.rh .lb,.rh .q{font-weight:700;font-size:19px;line-height:1.15}
.rh-cap{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px;text-align:right}

/* trampas */
.traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-block:8px 36px}
.trapc{background:var(--surface);border:2px dashed var(--gris);border-radius:16px;padding:14px 16px}
.trapc .tag{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--negro);color:#fff;padding:4px 8px;border-radius:6px}
.trapc p{margin:8px 0 0;font-size:15px}

section.block{padding-block:28px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px 24px;margin-bottom:18px}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;padding-bottom:8px;background:linear-gradient(var(--principal-linea),var(--principal-linea)) left bottom/64px 5px no-repeat}
.sec-head p{margin:0;color:var(--muted);max-width:62ch}

/* mapa mental */
.map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px minmax(0,1fr);grid-template-areas:"b1 core b2" "b3 core b4";gap:26px 70px;align-items:start}
.map.n2{grid-template-areas:"b1 core b2"}
.map.n3{grid-template-areas:"b1 core b2" "b3 core ."}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map svg.wires path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--cl)}
.core{grid-area:core;align-self:center;position:relative;z-index:1;background:var(--principal);color:var(--principal-ink);border-radius:50%;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;box-shadow:0 0 0 10px var(--principal-halo),var(--shadow)}
.core .t{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.core .s{font-size:19px;font-weight:700;line-height:1.15}
.b1{grid-area:b1}.b2{grid-area:b2}.b3{grid-area:b3}.b4{grid-area:b4}
.branch{position:relative;z-index:1;min-width:0}
.bhead{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;background:var(--c);color:var(--ci)}
.bhead .let{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;min-width:34px;text-align:center;white-space:nowrap}
.bhead .ti{font-weight:700;font-size:19px;line-height:1.15}
.hk{font-size:14px;color:var(--muted);font-weight:600;margin:6px 0 0 14px}
.hk.v{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.leaves{list-style:none;margin:10px 0 0 22px;padding:0 0 0 18px;border-left:3px solid var(--cl);display:flex;flex-direction:column;gap:8px}
.leaf{position:relative}
.leaf::before{content:"";position:absolute;left:-18px;top:28px;width:14px;border-top:3px solid var(--cl)}
.chip{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.chip:hover{transform:translateX(3px);border-color:var(--cl)}
.chip .num{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;white-space:nowrap;margin-top:2px}
.chip .nm{font-weight:700;font-size:15px;line-height:1.2;transition:filter .2s}
.chip .sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.chip .desc{display:block;font-weight:500;font-size:13px;line-height:1.35;color:var(--ink);margin-top:6px;transition:filter .2s}
.chip .ord{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:var(--c);color:var(--ci);min-width:38px;height:38px;padding:0 6px;border-radius:19px;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:2px}
.chip.star{border:3px solid var(--principal-linea)}
.frac{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.frac::before{content:"";position:absolute;left:-19px;top:32px;width:15px;border-top:3px solid var(--cl)}
.frac>button{width:100%;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer}
.frac .rom{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;background:var(--c);color:var(--ci);border-radius:10px;min-height:46px;display:grid;place-items:center;padding:4px}
.frac .nm{font-weight:700;font-size:16px;line-height:1.15}
.frac .hookt{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.frac .cnt{font-family:var(--f-display);font-size:12px;color:var(--muted);white-space:nowrap}
.frac .inc{margin:0;padding:0 14px 12px 88px;font-size:14px}
.frac .inc li{margin:3px 0}
body.recite .nm,body.recite .hookt,body.recite .chip .desc{filter:blur(8px);user-select:none}
body.recite .shown .nm,body.recite .shown .hookt,body.recite .shown .desc{filter:none}

.chant{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.chant p{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,2.2vw,26px);line-height:1.4;margin:8px 0 0}
.chant p span{white-space:nowrap}
.chant p i{font-style:normal;font-size:.6em;color:var(--muted);vertical-align:.4em;margin-right:2px;font-weight:700}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden;display:flex;flex-direction:column}
.card.wide{grid-column:1/-1}
.card .cbody{padding:16px 18px}
.card .bar{height:10px;background:var(--c)}
.card .chead{background:var(--c);color:var(--ci);padding:12px 16px}
.card .chead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1}
.card .chead .a{font-size:19px;font-weight:700}
.card h3{font-size:21px;font-weight:700;margin-top:4px}
.card ul{margin:10px 0 0;padding-left:18px}
.card li{margin:5px 0}
.card p{margin:8px 0 0}
.art{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);margin-top:6px}
.frow{padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.frow:first-of-type{border-top:0}
.frow .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.frow ul{margin:4px 0 0;padding-left:18px}
.note{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}

/* escala */
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.lvl{border-radius:12px;padding:12px;border-top:10px solid var(--lc);background:var(--surface-2);min-width:0}
.lvl .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.lvl .t{font-weight:700;font-size:16px;margin-top:4px;line-height:1.15}
.lvl .d{font-size:13px;color:var(--muted);margin-top:6px}
.lvl .req{margin-top:8px;font-size:13px;font-weight:700;background:var(--surface);border-radius:8px;padding:6px 8px}
.memo{margin-top:12px;font-size:14px;color:var(--muted)}

/* pasos */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;position:relative}
.track::before{content:"";position:absolute;left:5%;right:5%;top:27px;border-top:3px solid var(--principal-linea);z-index:0}
.track li{position:relative;z-index:1}
.pill{width:100%;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:0 2px}
.pill .circ{width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--principal-linea);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.pill .nm{font-weight:700;font-size:14px;line-height:1.15}
.pill[aria-selected="true"] .circ{background:var(--principal);color:var(--principal-ink)}
.stepd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:22px;padding:22px 26px}
.stepd .big{width:84px;height:84px;border-radius:50%;background:var(--principal);color:var(--principal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:44px}
.stepd h3{font-size:clamp(24px,3vw,34px);font-weight:700}
.stepd .hook{margin-top:10px;font-weight:700;font-size:17px}
.stepd ul{margin:10px 0 0;padding-left:20px;columns:2;column-gap:36px}
.stepd li{margin:0 0 8px;break-inside:avoid}
.stepnav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* flujo en carriles */
.lanes{display:flex;flex-direction:column;gap:16px}
.lane{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.lhead{border-radius:14px;background:var(--c);color:var(--ci);padding:14px;display:flex;flex-direction:column;justify-content:center}
.lhead .t{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05}
.lhead .s{font-weight:700;font-size:19px;line-height:1.15;margin-top:4px}
.flow{display:flex;align-items:stretch;min-width:0}
.node{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.node h4{font-size:18px;font-weight:700;line-height:1.15}
.node p{margin:6px 0 0;font-size:14px}
.plazo{display:inline-block;margin-top:8px;background:var(--surface-2);border:1.5px solid var(--oscuro);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.arrow{flex:none;width:34px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--oscuro)}

/* cifras */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.numt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.numt .v{font-family:var(--f-display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.numt .v small{font-size:16px;font-weight:600;margin-left:4px;color:var(--muted)}
.numt .d{font-weight:600;font-size:14px;margin-top:6px;line-height:1.25}
.numt .r{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted)}

/* simulador */
.simbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px}
.qsim{border:2px solid var(--negro);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qsim[aria-pressed="true"]{background:var(--negro);color:#fff}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qmode{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.qmode small{font-weight:600;opacity:.7;margin-left:2px}
.qmode[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--negro)}
.bankinfo{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow);max-width:1040px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted)}
.qprog{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0 18px}
.qprog i{display:block;height:100%;background:var(--principal-linea);width:0;transition:width .3s}
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtag span{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:16px;cursor:pointer}
.opt .key{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--oscuro)}
.opt.right{border:3px solid var(--principal-linea);background:var(--surface);box-shadow:inset 8px 0 0 var(--principal)}
.opt.wrong{border:3px solid var(--negro);background:var(--surface);text-decoration:line-through;text-decoration-thickness:2px}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;min-height:24px;font-weight:600}
.fb .ok,.fb .no{display:inline-block;font-weight:700;font-size:19px;border-radius:6px;padding:0 8px;margin-right:6px}
.fb .ok{background:var(--principal);color:var(--principal-ink)} .fb .no{background:var(--negro);color:#fff}
.fb .ref,.miss .ref{display:block;margin-top:6px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--muted)}
.qactions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--coral);color:var(--negro);text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-weight:600;font-size:17px;margin-top:4px}
.score .big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1}
.trows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.trow2{display:grid;grid-template-columns:minmax(0,300px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.trow2 .tb{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow2 .tb i{display:block;height:100%;background:var(--principal-linea)}
.trow2 .tv{font-variant-numeric:tabular-nums;font-weight:700}
.miss{margin-top:16px;background:var(--surface-2);border-radius:12px;padding:12px 16px}
.miss summary{cursor:pointer}
.miss ul{margin:6px 0 0;padding-left:18px} .miss li{margin:8px 0}
.siminfo{font-size:13px;color:var(--muted);margin:12px 0 0}

/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(27,27,30,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{padding:20px 22px 18px;background:var(--c);color:var(--ci);display:flex;justify-content:space-between;gap:12px;align-items:center}
.dhead h3{font-size:28px;font-weight:700;color:inherit}
.dhead .x{background:rgba(255,255,255,.25);border:0;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;color:inherit;flex:none}
.dbody{padding:16px 22px 30px;overflow:auto}
.dbody ul{padding-left:18px;margin:0}
.dbody li{margin:8px 0}
.dbody .hook{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;margin:8px 0 12px}

footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:4px solid var(--membrete);padding-top:14px}
footer b{color:var(--ink)}

@media (max-width:1100px){.track{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:18px}.track::before{display:none}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .map,.map.n2,.map.n3{grid-template-columns:1fr;grid-template-areas:"core" "b1" "b2" "b3" "b4";gap:22px}
  .map svg.wires{display:none}
  .core{width:230px;justify-self:center}
  .opts{grid-template-columns:1fr}
  .lane{grid-template-columns:1fr}
  .flow{flex-direction:column}
  .arrow{width:auto;height:30px;transform:rotate(90deg)}
  .stepd{grid-template-columns:1fr}
  .stepd ul{columns:1}
  .track{grid-template-columns:repeat(3,minmax(0,1fr))}
  .frac .inc{padding-left:16px}
}
@media (max-width:600px){ .chant p span{white-space:normal} .trow2{grid-template-columns:1fr auto}.trow2 .tb{grid-column:1/-1;order:3} }
@media (max-width:520px){ .rhythm{flex-wrap:wrap} .rh{flex:1 1 40%} }
.printhead{display:none}
@media print{
  body{background:#fff;padding:0}
  .top,.hero,.traps,section.block:not(.sim),footer,.simbar,.modes,.sim > .lbl,.sim .sec-head,.qactions,.siminfo,.drawer,.scrim{display:none!important}
  .quiz{box-shadow:none;border:0;padding:0;max-width:none}
  .printhead{display:block;font-family:var(--f-display);font-size:14px;margin:0 0 8px}
  .miss{background:none;padding:0} .miss li{break-inside:avoid;margin:10px 0}
  .trow2 .tb{border-color:#999} *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

rificar que obtuvo autorización de la CNBV para su Modelo Novedoso. ¿Qué fracción del OCTAVO A?","a":"XII","o":["XII","X","XI","VIII"],"x":"Fracción XII · Modelos Novedosos.","ref":"OCTAVO A, fr. XII"},{"id":"L075","tema":"fr","tipo":"caso","q":"Caso de auditoría: Verificar si comunicó la transmisión de acciones o partes sociales por más del 2% del capital social pagado. ¿Qué fracción del OCTAVO A?","a":"XIII","o":["VI","III","XII","XIII"],"x":"Fracción XIII · Otra información.","ref":"OCTAVO A, fr. XIII, inc. b)"},{"id":"L076","tema":"fr","tipo":"caso","q":"Caso de auditoría: Revisar si los expedientes los integran y conservan terceros que operan a su nombre. ¿Qué fracción del OCTAVO A?","a":"XIV","o":["IV","IX","XIV","II"],"x":"Fracción XIV · Comisionistas.","ref":"OCTAVO A, fr. XIV"},{"id":"L077","tema":"bcd","tipo":"memoria","q":"En la sección B del OCTAVO, «Cumple Mayoritariamente» obliga a incluir al menos…","a":"Una recomendación de mejora","o":["Una recomendación de mejora","Un hallazgo","Una acción correctiva","Un asunto clave en la sección C"],"x":"En «Cumple Mayoritariamente» el Auditor debe incluir al menos una recomendación de mejora y, en su caso, algún hallazgo; el hallazgo obligatorio corresponde a «Cumple Parcialmente» y «No cumple».","ref":"OCTAVO B, num. 2"},{"id":"L079","tema":"bcd","tipo":"cifra","q":"¿Cuántos sentidos de evaluación tiene la sección B del OCTAVO?","a":"5","o":["3","4","5","14"],"x":"Cumple, Mayoritariamente, Parcialmente, No cumple y No aplica.","ref":"OCTAVO B, párr. primero y num. 1 a 5"},{"id":"L082","tema":"lin","tipo":"cifra","q":"Sin licenciatura, ¿cuánta experiencia en PLD/FT necesita el Auditor (CUARTO)?","a":"5 años","o":["3 años","5 años","2 años","10 años"],"x":"Con licenciatura 3 años; sin licenciatura 5 años.","ref":"CUARTO, fr. I, párr. segundo"},{"id":"L084","tema":"lin","tipo":"cifra","q":"¿Tipografía mínima del Informe de Auditoría (NOVENO)?","a":"10 puntos","o":["8 puntos","10 puntos","11 puntos","12 puntos"],"x":"NOVENO: español, al menos 10 puntos, índice y negrillas.","ref":"NOVENO"},{"id":"L086","tema":"lin","tipo":"cifra","q":"¿Cuántas variables mínimas tiene el análisis de riesgos del Auditor (SEXTO)?","a":"5","o":["3","4","5","9"],"x":"SEXTO, fr. II, incs. a) a e): productos/servicios, clientes/usuarios, países/áreas, transacciones/canales e infraestructura tecnológica; la lista es mínima («entre otras»).","ref":"SEXTO, fr. II, incs. a) a e)"},{"id":"L087","tema":"lin","tipo":"memoria","q":"¿Por qué medio se remite el Informe de Auditoría a la Comisión (DÉCIMO PRIMERO)?","a":"SITI PLD/FT","o":["SITI PLD/FT","Oficialía de partes","Correo electrónico al supervisor","SIARA (requerimientos de autoridad)"],"x":"Por SITI PLD/FT, en PDF con texto seleccionable.","ref":"DÉCIMO PRIMERO, párrs. segundo y cuarto"},{"id":"L088","tema":"lin","tipo":"cifra","q":"¿Qué ventana previa se revisa para determinar la independencia del Auditor o socio (QUINTO)?","a":"El año inmediato anterior al contrato","o":["El año inmediato anterior al contrato","Los tres años anteriores a la emisión del Informe","Los 5 años anteriores","Sólo durante la auditoría"],"x":"QUINTO, fracción I, inciso a).","ref":"QUINTO, fr. I, inc. a)"},{"id":"L089","tema":"bcd","tipo":"memoria","q":"¿Qué sección del OCTAVO se desarrolla «en caso de requerirse» para lo preocupante?","a":"C. Asuntos clave de la auditoría","o":["A. Resultados de la revisión","B. Cumplimiento regulatorio","C. Asuntos clave de la auditoría","D. Hallazgos y acciones correctivas"],"x":"Sección C: medidas no acordes, controles ineficaces, infracciones graves o irregularidades 139 Quáter / 400 Bis.","ref":"OCTAVO C, párr. primero"},{"id":"L090","tema":"fr","tipo":"cifra","q":"¿Cuántas fracciones tiene la sección A del OCTAVO?","a":"14","o":["12","13","14","15"],"x":"De la I (Identificación) a la XIV (Comisionistas).","ref":"OCTAVO A, fr. I a XIV"},{"id":"L091","tema":"lin","tipo":"trampa","q":"«Apartado A» de los Lineamientos corresponde a…","a":"Lineamientos preliminares (PRIMERO a TERCERO)","o":["Lineamientos preliminares (PRIMERO a TERCERO)","Resultados de la revisión (14 fracciones)","Del Auditor (CUARTO y QUINTO)","Del Informe de Auditoría (NOVENO a DÉCIMO SEGUNDO)"],"x":"No confundir con la sección A del OCTAVO.","ref":"Índice; Apartado A (PRIMERO a TERCERO)"},{"id":"L092","tema":"bcd","tipo":"memoria","q":"Según el OCTAVO, sección B, ¿qué debe evaluarse en alguno de los sentidos de evaluación previstos?","a":"Cada una de las obligaciones a que se refiere la sección A","o":["El Informe en su conjunto, con una sola calificación global","Sólo las obligaciones que el Auditor clasifique como de Riesgo alto","Cada una de las obligaciones a que se refiere la sección A","Únicamente las obligaciones con hallazgos del año anterior"],"x":"La sección B dispone que la evaluación de cada una de las obligaciones de la sección A deberá ser en cualquiera de los cinco sentidos.","ref":"OCTAVO B, párr. primero"},{"id":"L093","tema":"lin","tipo":"caso","q":"Un candidato a Auditor tiene licenciatura en Contaduría y dos años de experiencia en prevención, detección y reporte de operaciones PLD/FT. ¿Cumple la fr. I del CUARTO?","a":"No, con licenciatura requiere al menos tres años de experiencia en la materia","o":["No, con licenciatura requiere al menos cinco años de experiencia","No, con licenciatura requiere al menos tres años de experiencia en la materia","Sí, siempre que cuente con Certificado vigente de la Comisión","Sí, con licenciatura basta con dos años de experiencia en prevención, detección y reporte"],"x":"La fr. I del CUARTO exige licenciatura y al menos tres años de experiencia en PLD/FT; los cinco años aplican a quien no tiene ese nivel de estudios.","ref":"CUARTO, fr. I"},{"id":"L094","tema":"lin","tipo":"memoria","q":"Según el QUINTO, fr. I, ¿durante qué periodo deben ser y mantenerse independientes la Persona Moral, el Auditor y su equipo?","a":"Desde la celebración del contrato, durante la auditoría y hasta la emisión del Informe","o":["Desde la emisión del Informe hasta su remisión a la Comisión","Desde la celebración del contrato, durante la auditoría y hasta la emisión del Informe","Durante el periodo revisado y hasta que el Informe se remite a la Comisión por el SITI PLD/FT","Sólo a la fecha de celebración del contrato de servicios"],"x":"La fr. I del QUINTO exige independencia a la fecha del contrato, durante el desarrollo de la auditoría y hasta la emisión del Informe.","ref":"QUINTO, fr. I"},{"id":"L095","tema":"bcd","tipo":"caso","q":"Tras la auditoría, el Auditor no identificó ningún aspecto, condición o información preocupante. ¿Está obligado a desarrollar la sección C, Asuntos clave?","a":"No, esa sección se desarrolla en caso de requerirse","o":["Sí, siempre debe incluirse, aunque sea en blanco","No, esa sección se desarrolla en caso de requerirse","Sí, debe manifestar la inexistencia en una carta a la Comisión","Sí, debe desarrollarla con las obligaciones calificadas como No cumple"],"x":"El OCTAVO C dispone que, en caso de requerirse, el Auditor desarrollará una sección con lo preocupante.","ref":"OCTAVO C, párr. primero"},{"id":"L096","tema":"bcd","tipo":"trampa","q":"¿Cuál de los siguientes elementos NO se prevé en la sección D del OCTAVO?","a":"La estimación del monto de la sanción por cada hallazgo","o":["Los plazos para la implementación","La estimación del monto de la sanción por cada hallazgo","Las personas responsables de supervisar la implementación","Las acciones correctivas correspondientes a cada hallazgo"],"x":"La sección D incluye hallazgos con acciones correctivas, recomendaciones de mejora, plazos y responsables de implementación y supervisión; no montos de sanción.","ref":"OCTAVO D, párr. primero"},{"id":"L097","tema":"lin","tipo":"caso","q":"Al enviar su Informe por SITI PLD/FT, una casa de cambio omite la carta bajo protesta del Auditor, pues argumenta que basta tenerla en su archivo. ¿Es correcto?","a":"No, debe remitirla a la Comisión al momento de entregar el Informe por SITI PLD/FT","o":["No, debe enviarla por SITI PLD/FT dentro de los diez días hábiles siguientes a la entrega del Informe","Sí, la carta sólo se envía cuando el Auditor es externo","No, debe remitirla a la Comisión al momento de entregar el Informe por SITI PLD/FT","Sí, basta conservarla y exhibirla sólo si la Comisión la requiere"],"x":"El DÉCIMO PRIMERO obliga a remitir, al momento de la entrega del Informe por SITI PLD/FT, la carta del CUARTO, inciso d).","ref":"DÉCIMO PRIMERO, párr. tercero"},{"id":"L098","tema":"lin","tipo":"memoria","q":"Según el SEXTO, la metodología de planeación debe servir al Auditor para…","a":"Conocer al Sujeto Supervisado y definir el alcance del programa de trabajo","o":["Conocer al Sujeto Supervisado y definir el alcance del programa de trabajo","Sustituir la metodología de evaluación de Riesgos del Sujeto Supervisado","Determinar el monto de las sanciones aplicables al Sujeto Supervisado","Calificar el Grado de Riesgo de cada Cliente del Sujeto Supervisado"],"x":"El SEXTO dispone que la metodología sirve al Auditor para conocer al Sujeto Supervisado y definir el alcance del programa de trabajo del SÉPTIMO.","ref":"SEXTO, párr. primero"},{"id":"L099","tema":"lin","tipo":"caso","q":"Un despacho contratado por una casa de bolsa propone que el Informe de Auditoría aparezca firmado sólo con la razón social del despacho, sin persona física responsable. ¿Es acorde con los lineamientos?","a":"No, el Auditor es la persona física que elabora y firma el Informe","o":["Sí, siempre que el despacho tenga Certificado vigente como persona moral","No, porque el Informe debe firmarlo el Oficial de Cumplimiento","Sí, porque la Persona Moral es quien presta el servicio contratado","No, el Auditor es la persona física que elabora y firma el Informe"],"x":"El SEGUNDO, fr. I, define al Auditor como persona física responsable de elaborar y firmar; la Persona Moral (fr. VII) sólo es la contratada para prestar el servicio.","ref":"SEGUNDO, fr. I y VII"},{"id":"L100","tema":"lin","tipo":"memoria","q":"Según el PRIMERO, ¿qué objeto tiene el Informe de Auditoría para los propios Sujetos Supervisados?","a":"Darles información para hacer más eficientes sus procesos preventivos y establecer planes de acción","o":["Acreditar ante la Comisión la certificación del Oficial de Cumplimiento","Darles información para hacer más eficientes sus procesos preventivos y establecer planes de acción","Sustituir la evaluación de Riesgos que el Sujeto Supervisado debe realizar","Darle a la Comisión los elementos para imponer sanciones al Sujeto Supervisado sin necesidad de realizar visita"],"x":"El PRIMERO señala que el Informe busca brindar a los Sujetos Supervisados información para hacer más eficientes sus procesos, mecanismos y herramientas, y establecer planes de acción.","ref":"PRIMERO, párr. segundo"},{"id":"L101","tema":"lin","tipo":"trampa","q":"¿Cuál de los siguientes elementos NO forma parte del contenido mínimo del programa de trabajo del SÉPTIMO?","a":"Los honorarios pactados con la Persona Moral","o":["El calendario de actividades a realizar","Los honorarios pactados con la Persona Moral","Las pruebas a los sistemas automatizados","La forma de seguimiento a las acciones correctivas"],"x":"El SÉPTIMO incluye calendario, temas a evaluar (pruebas a sistemas, revisiones aleatorias de expedientes, recursos) y la forma de seguimiento a acciones correctivas.","ref":"SÉPTIMO"},{"id":"L102","tema":"lin","tipo":"caso","q":"Un despacho internacional entrega a un banco un Informe PLD/FT redactado en inglés, con índice y divisiones en negrillas. ¿Cumple el NOVENO?","a":"No, el Informe debe estar redactado en idioma español","o":["Sí, si el Auditor tiene Certificado vigente","Sí, porque el NOVENO no regula el idioma del Informe","No, el Informe debe estar redactado en idioma español","Sí, si se acompaña de un resumen ejecutivo en español"],"x":"El NOVENO exige que el Informe de Auditoría esté redactado en idioma español.","ref":"NOVENO"},{"id":"L103","tema":"lin","tipo":"caso","q":"Un Informe afirma: «El sistema automatizado genera correctamente las alertas», sin indicar qué pruebas o documentos lo sustentan. ¿Qué lineamiento se incumple y por qué?","a":"El DÉCIMO: toda manifestación debe sustentarse en pruebas que el Auditor relacione","o":["El DÉCIMO: toda manifestación debe sustentarse en pruebas que el Auditor relacione","El SÉPTIMO: la afirmación debe aparecer en el calendario de actividades","El DÉCIMO PRIMERO: la afirmación y su sustento deben constar en el escrito de remisión a la Comisión","Ninguno: basta la firma del Auditor con Certificado vigente"],"x":"El DÉCIMO exige que las manifestaciones del Informe se sustenten en pruebas, que el Auditor justifique cada una e indique y relacione las pruebas.","ref":"DÉCIMO"},{"id":"L104","tema":"lin","tipo":"caso","q":"Un banco remitió su Informe de Auditoría en marzo de 2022. En septiembre de 2026 la Comisión le requiere la documentación generada con motivo de los lineamientos. ¿Debe tenerla?","a":"Sí, debe conservarla al menos cinco años contados desde la remisión del Informe","o":["Sí, pero sólo si la Persona Moral no la conservó","No, el plazo se cuenta desde el cierre del periodo revisado","No, el plazo de conservación de esa documentación es de tres años contados desde la remisión del Informe","Sí, debe conservarla al menos cinco años contados desde la remisión del Informe"],"x":"El DÉCIMO SEGUNDO obliga a conservar la información por no menos de cinco años contados a partir de la remisión del Informe; en septiembre de 2026 no han transcurrido.","ref":"DÉCIMO SEGUNDO"},{"id":"L105","tema":"bcd","tipo":"trampa","q":"¿Cuál de las siguientes NO es uno de los sentidos de evaluación previstos en la sección B del OCTAVO?","a":"Cumple con salvedades","o":["No aplica","Cumple con salvedades","Cumple Parcialmente","Cumple Mayoritariamente"],"x":"Los cinco sentidos son: Cumple, Cumple Mayoritariamente, Cumple Parcialmente, No cumple y No aplica.","ref":"OCTAVO B, num. 1 a 5"},{"id":"L106","tema":"lin","tipo":"caso","q":"Una licenciada en Finanzas tiene diez años en auditoría de estados financieros, pero ninguna experiencia en prevención de lavado de dinero. ¿Acredita la experiencia de la fr. I del CUARTO?","a":"No, la experiencia exigida es en prevención, detección y reporte de ORPI y FT","o":["Sí, cualquier experiencia en auditoría superior a cinco años es suficiente","No, la experiencia exigida es en prevención, detección y reporte de ORPI y FT","Sí, porque con licenciatura no se exige experiencia específica","No, porque además debe tener posgrado en materia financiera"],"x":"La fr. I del CUARTO pide experiencia de al menos tres años específicamente en prevención, detección y reporte de ORPI y FT.","ref":"CUARTO, fr. I"},{"id":"L107","tema":"lin","tipo":"memoria","q":"Cuando se contrata a una Persona Moral, ¿a quiénes exige el QUINTO ser y mantenerse independientes del Sujeto Supervisado?","a":"A la Persona Moral, al Auditor y a quienes formen parte del equipo de auditoría","o":["A la Persona Moral, al Auditor y a quienes formen parte del equipo de auditoría","Únicamente a la Persona Moral y a sus socios","Al Auditor y a los socios de la Persona Moral, pero no a los demás integrantes del equipo de auditoría","Únicamente al Auditor que firma el Informe"],"x":"La fr. I del QUINTO incluye a la Persona Moral, al Auditor y a las personas que formen parte del equipo de auditoría.","ref":"QUINTO, fr. I"},{"id":"L108","tema":"bcd","tipo":"memoria","q":"¿Qué describe el Auditor en la sección C del OCTAVO, Asuntos clave de la auditoría?","a":"Los aspectos, condiciones o información preocupante que consideró al realizar la auditoría","o":["La conformación accionaria de la Persona Moral","Los aspectos, condiciones o información preocupante que consideró al realizar la auditoría","La relación de expedientes de Clientes de Grado de Riesgo alto revisados y los datos faltantes en cada uno","El calendario de actividades, los temas a evaluar y los recursos con que cuenta el Sujeto Supervisado"],"x":"La sección C describe con claridad los aspectos, condiciones o información preocupante que el Auditor consideró.","ref":"OCTAVO C, párr. primero"},{"id":"L109","tema":"bcd","tipo":"caso","q":"Un Informe presenta un hallazgo con su acción correctiva, pero no señala plazo ni responsables. ¿Qué exige la sección D?","a":"Incluir plazos y personas responsables de la implementación y de su supervisión","o":["Sólo el nombre del Oficial de Cumplimiento como responsable","Incluir el costo estimado y la aprobación del consejo de administración para implementar la acción correctiva","Nada más, pues los plazos los fija después la Comisión","Incluir plazos y personas responsables de la implementación y de su supervisión"],"x":"El OCTAVO D pide incluir los plazos y las personas responsables para la implementación y la supervisión.","ref":"OCTAVO D, párr. primero"},{"id":"L110","tema":"lin","tipo":"memoria","q":"Según el DÉCIMO PRIMERO, ¿para qué deben conocer el Informe la dirección general y el Comité o, en su caso, el Oficial de Cumplimiento?","a":"Para evaluar la eficacia operativa de las medidas y dar seguimiento a las acciones correctivas","o":["Para determinar los honorarios finales de la Persona Moral","Para evaluar la eficacia operativa de las medidas y dar seguimiento a las acciones correctivas","Para aprobar o rechazar las calificaciones asignadas por el Auditor antes de remitir el Informe a la Comisión","Para modificar el Informe antes de su remisión a la Comisión"],"x":"El DÉCIMO PRIMERO señala que deben conocerlo para evaluar la eficacia operativa de las medidas y dar seguimiento a los programas de acción correctiva.","ref":"DÉCIMO PRIMERO, párr. primero"},{"id":"L111","tema":"lin","tipo":"trampa","q":"¿Cuál de los siguientes NO es uno de los criterios mínimos de la metodología de planeación del SEXTO?","a":"Opinión previa del Comité sobre el alcance de la auditoría","o":["Análisis de Riesgos elaborado por el Auditor","Opinión previa del Comité sobre el alcance de la auditoría","Cuestionario inicial de conocimiento del Sujeto Supervisado","Revisión de toda la información y documentación pertinente"],"x":"El SEXTO prevé como mínimo: cuestionario inicial (fr. I), análisis de Riesgos (fr. II) y revisión de información pertinente (fr. III).","ref":"SEXTO, fr. I a III"},{"id":"L112","tema":"lin","tipo":"memoria","q":"Según el SEGUNDO, el Certificado es el documento que…","a":"Expide electrónicamente la Comisión y hace constar la certificación prevista en la LCNBV","o":["Expide la UIF de la Secretaría para acreditar la experiencia del Auditor en materia de PLD/FT","Expide la Persona Moral para acreditar la independencia del Auditor","Expide electrónicamente la Comisión y hace constar la certificación prevista en la LCNBV","Emite un organismo autorregulatorio para registrar a auditores externos"],"x":"La fr. II del SEGUNDO define el Certificado como documento expedido electrónicamente por la Comisión conforme al art. 4, fr. X y X Bis, de la LCNBV.","ref":"SEGUNDO, fr. II"},{"id":"L113","tema":"lin","tipo":"caso","q":"Un auditor decide revisar un control PLD/FT del banco que los lineamientos no mencionan expresamente. El director jurídico sostiene que no puede salirse de lo listado. ¿Quién tiene razón?","a":"El auditor: los supuestos de los lineamientos son enunciativos y no lo limitan","o":["El director jurídico: cualquier tema adicional requiere autorización previa de la Comisión","El auditor, siempre que el Comité apruebe por escrito ampliar el alcance","El director jurídico: los supuestos de los lineamientos son limitativos","El auditor: los supuestos de los lineamientos son enunciativos y no lo limitan"],"x":"El PRIMERO dispone que los supuestos previstos son enunciativos y no limitan al Auditor en la elaboración del Informe.","ref":"PRIMERO, último párrafo"},{"id":"L114","tema":"lin","tipo":"caso","q":"Un banco exige que el trabajo del programa de auditoría se realice sólo en sus oficinas; el Auditor propone hacer parte fuera de ellas. Según el SÉPTIMO, ¿cómo se resuelve?","a":"Se podrá realizar dentro o fuera de las instalaciones, conforme lo determinen ambas partes","o":["Debe realizarse siempre dentro de las instalaciones del Sujeto Supervisado, conforme a su Manual de Cumplimiento","Lo decide exclusivamente el Auditor responsable","Se podrá realizar dentro o fuera de las instalaciones, conforme lo determinen ambas partes","Lo decide la Comisión a solicitud del Sujeto Supervisado"],"x":"El SÉPTIMO, tras regular el programa de trabajo, dispone: «Lo anterior, se podrá realizar dentro o fuera de las instalaciones del Sujeto Supervisado, conforme lo determinen ambas partes».","ref":"SÉPTIMO, parte final"},{"id":"L115","tema":"lin","tipo":"caso","q":"Un Informe distingue sus capítulos y apartados sólo con letra cursiva, sin negrillas. ¿Qué establece el NOVENO?","a":"Las divisiones deben resaltarse en negrillas","o":["Las divisiones deben resaltarse en negrillas","Las divisiones deben resaltarse en cursiva y subrayado","Basta cualquier formato si el Informe tiene índice","Las divisiones sólo deben numerarse con romanos"],"x":"El NOVENO pide que las secciones, capítulos, apartados o incisos estén resaltados en negrillas para diferenciar las divisiones.","ref":"NOVENO"},{"id":"L116","tema":"lin","tipo":"caso","q":"Al citar el manual de cumplimiento revisado, el Informe sólo dice «según el manual», sin versión ni fecha. ¿Qué debe procurar el Auditor conforme al DÉCIMO?","a":"Citar el texto íntegro del documento y señalar sus datos de identificación","o":["Citar el texto íntegro del documento y señalar sus datos de identificación","Anexar la opinión del Oficial de Cumplimiento sobre la versión del manual que fue revisada","Resumir el manual en no más de una cuartilla","Remitir el manual a la Comisión antes que el Informe"],"x":"El DÉCIMO pide indicar la documentación analizada, procurando citar el texto íntegro del documento y señalar sus datos de identificación.","ref":"DÉCIMO"},{"id":"L117","tema":"bcd","tipo":"memoria","q":"Conforme al OCTAVO B, la evaluación «Cumple» sólo podrá asignarse cuando…","a":"Se demuestre que no se requieren ni recomiendan mejoras para cumplir la obligación","o":["El Sujeto Supervisado no haya recibido observaciones de la Comisión en el año inmediato anterior","Existan recomendaciones de mejora, pero ningún hallazgo","El hallazgo detectado se haya corregido antes de emitir el Informe","Se demuestre que no se requieren ni recomiendan mejoras para cumplir la obligación"],"x":"El numeral 1 señala que la evaluación sólo podrá ser Cumple cuando se demuestre que no se requieren ni recomiendan mejoras.","ref":"OCTAVO B, num. 1"},{"id":"L118","tema":"lin","tipo":"caso","q":"El Certificado de un auditor estaba vigente cuando firmó el contrato con el banco, pero venció antes de que elaborara y firmara el Informe. ¿Cumple la fr. II del CUARTO?","a":"No, el Certificado debe estar vigente al momento de elaborar y firmar el Informe","o":["Sí, si lo renueva antes de que el Informe se remita a la Comisión a través del SITI PLD/FT","No, el Certificado debe estar vigente al momento de elaborar y firmar el Informe","Sí, siempre que estuviera vigente durante el periodo revisado","Sí, basta que estuviera vigente al celebrarse el contrato"],"x":"La fr. II del CUARTO exige contar con el Certificado vigente al momento de elaborar y firmar el Informe de Auditoría.","ref":"CUARTO, fr. II"},{"id":"L119","tema":"lin","tipo":"caso","q":"Un banco firma en septiembre de 2026 contrato con un despacho. Uno de sus socios fue Oficial de Cumplimiento hasta enero de 2026 en una casa de bolsa del mismo grupo financiero. ¿Hay independencia?","a":"No, fue Oficial de Cumplimiento en otro Sujeto Supervisado del mismo grupo en el año inmediato anterior","o":["Sí, porque el cargo lo ocupó en otra entidad y no en el banco auditado","No, pero sólo si ese socio forma parte del equipo que audita al banco","Sí, porque el supuesto sólo se refiere al Auditor que firma el Informe y no a los socios de la Persona Moral","No, fue Oficial de Cumplimiento en otro Sujeto Supervisado del mismo grupo en el año inmediato anterior"],"x":"El QUINTO, fr. I, inc. a), i), considera no independiente al Auditor o socio que fue OC en el Sujeto Supervisado o en otro del mismo grupo en el año inmediato anterior al contrato.","ref":"QUINTO, fr. I, inc. a), i)"},{"id":"L120","tema":"bcd","tipo":"caso","q":"Un auditor advierte que las medidas preventivas de una institución de fondos de pago electrónico no son acordes con los productos que ofrece. ¿Cómo lo trata la sección C?","a":"Como preocupante: medidas no acordes al tipo de servicios, productos u Operaciones","o":["Como preocupante: medidas no acordes al tipo de servicios, productos u Operaciones","Como irrelevante para la sección C, siempre que el sujeto cuente con Manual de Cumplimiento actualizado","Como preocupante sólo si la Comisión ya lo observó","Como un asunto que sólo va en el cuestionario inicial"],"x":"El OCTAVO C considera preocupante que las medidas implementadas no sean acordes al tipo de servicios, productos u Operaciones del sujeto.","ref":"OCTAVO C, párr. segundo"},{"id":"L121","tema":"bcd","tipo":"memoria","q":"En el Informe correspondiente a 2026, ¿qué seguimiento debe incluir el Auditor respecto de los hallazgos y acciones correctivas de informes previos?","a":"El que llevó a cabo el sujeto sobre los del Informe presentado en el año inmediato anterior","o":["El que llevó a cabo el sujeto sobre los del Informe presentado en el año inmediato anterior","El que realizó la Persona Moral anterior sobre los hallazgos de todos los informes que ella misma elaboró","Ninguno, cada Informe es independiente del anterior","El de todos los informes de los últimos cinco años"],"x":"El OCTAVO D exige el seguimiento del Sujeto Supervisado respecto de los hallazgos y acciones correctivas del Informe de Auditoría presentado en el año inmediato anterior.","ref":"OCTAVO D, párr. segundo"},{"id":"L122","tema":"lin","tipo":"caso","q":"Una SOFOM que, conforme a sus Disposiciones, está exceptuada de constituir Comité remite su Informe de Auditoría. ¿Quiénes deben conocer su contenido conforme al DÉCIMO PRIMERO?","a":"La dirección general y el Oficial de Cumplimiento","o":["La dirección general y el Oficial de Cumplimiento","Sólo el representante legal que firma el escrito","Sólo el consejo de administración","La dirección general y el auditor interno"],"x":"El DÉCIMO PRIMERO dispone que la dirección general y el Comité o, en su caso, el Oficial de Cumplimiento deben conocer el Informe.","ref":"DÉCIMO PRIMERO, párr. primero"},{"id":"L123","tema":"lin","tipo":"memoria","q":"El análisis de Riesgos del Auditor debe establecer los Riesgos que evaluará para atestiguar que el régimen preventivo del Sujeto Supervisado es…","a":"Suficiente y eficaz en su diseño y aplicación","o":["Proporcional al número de sucursales del Sujeto Supervisado","Idéntico al modelo sugerido por la Comisión","Aprobado por el consejo de administración","Suficiente y eficaz en su diseño y aplicación"],"x":"La fr. II del SEXTO busca atestiguar que el régimen preventivo es suficiente y eficaz en su diseño y aplicación.","ref":"SEXTO, fr. II"},{"id":"L124","tema":"lin","tipo":"cifra","q":"La definición de Financiamiento al Terrorismo del SEGUNDO remite a la conducta prevista en el Código Penal Federal, artículo…","a":"139 Quáter","o":["139 Bis","400","139 Quáter","400 Bis"],"x":"La fr. IV del SEGUNDO remite al art. 139 Quáter del CPF; el 400 Bis corresponde a Operaciones con Recursos de Procedencia Ilícita (fr. VI).","ref":"SEGUNDO, fr. IV y VI"},{"id":"L125","tema":"lin","tipo":"trampa","q":"¿Cuál de los siguientes NO es uno de los objetos que el PRIMERO asigna a los lineamientos?","a":"Establecer las sanciones por no presentar el Informe de Auditoría","o":["Fijar procedimientos y requisitos para la elaboración del Informe de Auditoría","Establecer las sanciones por no presentar el Informe de Auditoría","Fijar procedimientos y requisitos para remitir el Informe a la Comisión","Fijar requisitos mínimos para contratar Personas Morales y Auditores"],"x":"El PRIMERO prevé tres objetos: requisitos de contratación, de elaboración y de remisión del Informe; no regula sanciones.","ref":"PRIMERO, numerales 1 a 3"},{"id":"L126","tema":"lin","tipo":"memoria","q":"El programa de trabajo del SÉPTIMO debe considerar los recursos materiales, tecnológicos y humanos con que cuenta…","a":"El Sujeto Supervisado","o":["El Sujeto Supervisado","La Comisión para su supervisión","El equipo de auditoría","La Persona Moral contratada"],"x":"El SÉPTIMO incluye entre los temas a evaluar los recursos materiales, tecnológicos y humanos con que cuenta el Sujeto Supervisado.","ref":"SÉPTIMO"},{"id":"L127","tema":"lin","tipo":"trampa","q":"¿Cuál de los siguientes elementos NO lo exige el NOVENO para la redacción y estructura del Informe?","a":"Un resumen ejecutivo al inicio del Informe","o":["Tipografía de al menos 10 puntos","Un resumen ejecutivo al inicio del Informe","Un índice","Divisiones del Informe resaltadas en negrillas"],"x":"El NOVENO exige español, tipografía mínima de 10 puntos, índice y divisiones en negrillas; no menciona resumen ejecutivo.","ref":"NOVENO"},{"id":"L128","tema":"bcd","tipo":"caso","q":"Un auditor demuestra la eficacia de los mecanismos de agrupación de Operaciones de un banco, pero en esa obligación incluye una recomendación de mejora. ¿Puede calificarla como «Cumple»?","a":"No, sólo procede Cumple si no se requieren ni recomiendan mejoras","o":["No, debe calificarla como No cumple por existir una recomendación","Sí, las recomendaciones de mejora no afectan la calificación","No, sólo procede Cumple si no se requieren ni recomiendan mejoras","Sí, siempre que la recomendación no derive de un hallazgo"],"x":"El OCTAVO B, num. 1, limita Cumple a cuando se demuestre que no se requieren ni recomiendan mejoras.","ref":"OCTAVO B, num. 1"},{"id":"L129","tema":"lin","tipo":"memoria","q":"¿Qué tipo de sentencia impide a una persona fungir como Auditor conforme a la fr. III del CUARTO?","a":"Sentencia por delitos patrimoniales","o":["Sentencia por delitos patrimoniales","Sentencia por delitos electorales","Sentencia civil por incumplimiento de contrato","Sentencia laboral por despido injustificado"],"x":"La fr. III del CUARTO exige no haber sido sentenciado por delitos patrimoniales.","ref":"CUARTO, fr. III"},{"id":"L130","tema":"lin","tipo":"caso","q":"Un despacho firma contrato con una SOFOM en marzo de 2026. Su socio director fue Oficial de Cumplimiento de esa SOFOM hasta diciembre de 2023. ¿Se actualiza el supuesto del QUINTO, fr. I, inc. a)?","a":"No, el supuesto se limita al año inmediato anterior a la celebración del contrato","o":["Sí, el supuesto abarca los tres años anteriores al contrato","Sí, el supuesto abarca los cinco años anteriores al contrato","Sí, haber sido Oficial de Cumplimiento del sujeto impide la independencia sin límite de tiempo","No, el supuesto se limita al año inmediato anterior a la celebración del contrato"],"x":"El QUINTO, fr. I, inc. a), se refiere a quien sea o haya sido OC durante el año inmediato anterior a la celebración del contrato.","ref":"QUINTO, fr. I, inc. a)"},{"id":"L131","tema":"bcd","tipo":"caso","q":"En sus pruebas, un auditor concluye que, operativamente, los controles de un banco para mitigar Riesgos no son eficaces, aunque están documentados. ¿Qué implica para la sección C?","a":"Es un supuesto preocupante que el Auditor debe describir en Asuntos clave","o":["Es un supuesto preocupante que el Auditor debe describir en Asuntos clave","Sólo es preocupante si hay un Reporte de 24 horas omitido","Debe informarse únicamente en el escrito de remisión","No es preocupante, porque basta que los controles estén documentados en el Manual de Cumplimiento"],"x":"El OCTAVO C considera preocupante cuando operativamente el Auditor considere que no existe eficacia en los controles para mitigar los Riesgos; en caso de requerirse, el Auditor desarrollará la sección de Asuntos clave con esos aspectos.","ref":"OCTAVO C, párr. segundo"},{"id":"L132","tema":"bcd","tipo":"caso","q":"En el año inmediato anterior, la Comisión formuló observaciones y acciones correctivas a un banco. ¿Qué debe contener el Informe de Auditoría en la sección D?","a":"Una sección con el seguimiento que dio el banco a esas observaciones y acciones","o":["Una sección con el seguimiento que dio el banco a esas observaciones y acciones","Nada, pues el seguimiento corresponde sólo a la Comisión","Sólo las observaciones que el banco haya impugnado","Una copia anexa del oficio de observaciones de la Comisión, sin describir el seguimiento del banco"],"x":"El OCTAVO D prevé, en su caso, una sección con el seguimiento del sujeto a observaciones, recomendaciones o acciones correctivas de la Comisión del año inmediato anterior.","ref":"OCTAVO D, párr. tercero"},{"id":"L133","tema":"lin","tipo":"memoria","q":"¿Quién puede firmar el escrito con el que se hace del conocimiento de la Comisión el Informe de Auditoría?","a":"El representante legal, el administrador único o el Oficial de Cumplimiento","o":["El Auditor que elaboró y firmó el Informe","El auditor interno o, en su caso, el presidente del Comité del Sujeto Supervisado","El socio director de la Persona Moral contratada, junto con el Auditor que firmó el Informe","El representante legal, el administrador único o el Oficial de Cumplimiento"],"x":"El DÉCIMO PRIMERO prevé un escrito firmado por el representante legal, administrador único u Oficial de Cumplimiento.","ref":"DÉCIMO PRIMERO, párr. segundo"},{"id":"L134","tema":"lin","tipo":"trampa","q":"¿Cuál de las siguientes NO es una de las variables que el SEXTO enumera para el análisis de Riesgos del Auditor?","a":"Estructura de capital del Sujeto Supervisado","o":["Estructura de capital del Sujeto Supervisado","Infraestructura Tecnológica del Sujeto Supervisado","Países y áreas geográficas en que opera","Transacciones y canales de envío o distribución"],"x":"Las variables del SEXTO, fr. II, son productos y servicios, clientes y usuarios, países y áreas geográficas, transacciones y canales, e Infraestructura Tecnológica.","ref":"SEXTO, fr. II"},{"id":"L135","tema":"lin","tipo":"trampa","q":"¿Cuál de las siguientes entidades NO aparece en la definición de Sujetos Supervisados del SEGUNDO?","a":"Instituciones de seguros","o":["Organismos de integración financiera rural","Instituciones de fondos de pago electrónico","Instituciones de seguros","Almacenes generales de depósito"],"x":"La fr. IX del SEGUNDO lista, entre otros, IFPE, almacenes generales de depósito y organismos de integración financiera rural; no incluye instituciones de seguros.","ref":"SEGUNDO, fr. IX"},{"id":"L136","tema":"bcd","tipo":"caso","q":"Un auditor califica una obligación como «Cumple Mayoritariamente» e incluye una recomendación de mejora, pero ningún hallazgo. ¿Es válido?","a":"Sí, el hallazgo en ese sentido sólo se incluye «en su caso»","o":["Sí, el hallazgo en ese sentido sólo se incluye «en su caso»","Sí, pero debe describirlo además en Asuntos clave","No, Cumple Mayoritariamente exige al menos un hallazgo","No, debe incluir al menos dos recomendaciones de mejora"],"x":"El OCTAVO B, num. 2, exige al menos una recomendación de mejora y, en su caso, algún hallazgo.","ref":"OCTAVO B, num. 2"},{"id":"L137","tema":"lin","tipo":"caso","q":"Un auditor con Certificado vigente se encuentra en concurso mercantil declarado conforme a la ley aplicable. ¿Puede elaborar el Informe de Auditoría?","a":"No, la fr. IV del CUARTO exige no estar en concurso mercantil","o":["No, la fr. IV del CUARTO exige no estar en concurso mercantil","No, pero sólo si el concurso deriva de un litigio con el Sujeto Supervisado","Sí, si el Sujeto Supervisado lo autoriza por escrito","Sí, el concurso mercantil sólo impide a la Persona Moral, no al Auditor"],"x":"La fr. IV del CUARTO pide no estar inhabilitado para el comercio, el servicio público o el sistema financiero, ni en concurso mercantil.","ref":"CUARTO, fr. IV"},{"id":"L138","tema":"lin","tipo":"caso","q":"Una SOFIPO contrata a un despacho para su Informe. Seis meses antes del contrato, el Auditor designado por el despacho era director de área, dos niveles abajo del director general, en otra SOFIPO del mismo grupo empresarial. ¿Es independiente?","a":"No, ocupó un cargo dentro de los tres niveles inferiores al director general en el mismo grupo","o":["No, ocupó un cargo dentro de los tres niveles inferiores al director general en el mismo grupo","Sí, el supuesto sólo aplica a grupos financieros, no a grupos empresariales","No, pero sólo si fue además representante legal de la entidad","Sí, el supuesto sólo aplica a quien fue director general o representante legal del propio sujeto auditado"],"x":"El QUINTO, fr. I, inc. a), ii), incluye cargos dentro de los tres niveles inmediatos inferiores al DG en el sujeto o en otro del mismo grupo financiero o empresarial.","ref":"QUINTO, fr. I, inc. a), ii)"},{"id":"L139","tema":"bcd","tipo":"memoria","q":"Según el OCTAVO C, los hallazgos se consideran preocupantes cuando se sitúan en…","a":"Alguna infracción grave en términos de las Leyes aplicables","o":["Cualquier observación menor del Comité","Una recomendación de mejora no atendida del Informe presentado el año anterior","Alguna infracción grave en términos de las Leyes aplicables","Un requisito calificado como No aplica"],"x":"El OCTAVO C incluye como preocupante la existencia de hallazgos que se sitúen en alguna infracción grave en términos de las Leyes aplicables.","ref":"OCTAVO C, párr. segundo"},{"id":"L140","tema":"bcd","tipo":"memoria","q":"Según el OCTAVO D, las recomendaciones de mejora se incluyen cuando, a juicio del Auditor, se requieran para…","a":"Dar cabal cumplimiento a las Disposiciones","o":["Reducir los costos operativos del Sujeto Supervisado","Obtener una calificación Cumple en el siguiente Informe","Dar cabal cumplimiento a las Disposiciones","Evitar una visita de inspección de la Comisión"],"x":"El OCTAVO D se refiere a las recomendaciones de mejora que a juicio del Auditor se requieran para dar cabal cumplimiento a las Disposiciones.","ref":"OCTAVO D, párr. primero"},{"id":"L141","tema":"lin","tipo":"trampa","q":"¿Cuál de los siguientes datos NO se exige en el escrito de remisión del Informe de Auditoría?","a":"El monto de los honorarios pagados a la Persona Moral","o":["El número y fecha del Certificado del Auditor","El periodo de revisión","La fecha en que la dirección general conoció el Informe","El monto de los honorarios pagados a la Persona Moral"],"x":"El escrito debe indicar fecha de conocimiento, periodo de revisión, nombre completo del Auditor, número y fecha de su Certificado y, en su caso, nombre de la Persona Moral.","ref":"DÉCIMO PRIMERO, párr. segundo"},{"id":"L142","tema":"lin","tipo":"caso","q":"En su análisis de Riesgos, un auditor consideró productos y servicios, tipo de clientes, países y áreas geográficas, y transacciones y canales. ¿Qué variable enumerada por el SEXTO omitió?","a":"La Infraestructura Tecnológica del Sujeto Supervisado","o":["La integración del Comité de Comunicación y Control","Los Mitigantes implementados por el Sujeto Supervisado","El resultado de la última visita de inspección","La Infraestructura Tecnológica del Sujeto Supervisado"],"x":"El SEXTO, fr. II, enumera cinco variables; la quinta es la Infraestructura Tecnológica con la que cuente el Sujeto Supervisado.","ref":"SEXTO, fr. II"},{"id":"L143","tema":"lin","tipo":"caso","q":"Una SOFOM no regulada argumenta que los lineamientos del informe de auditoría PLD/FT sólo aplican a SOFOM reguladas. ¿Es correcto?","a":"No, la definición de Sujetos Supervisados incluye SOFOM reguladas y no reguladas","o":["No, pero a las no reguladas sólo les aplica el apartado D","Sí, a las no reguladas les aplican sólo si pertenecen a un grupo financiero","Sí, las no reguladas sólo presentan informe si la Comisión lo requiere","No, la definición de Sujetos Supervisados incluye SOFOM reguladas y no reguladas"],"x":"La fr. IX del SEGUNDO incluye expresamente a las sociedades financieras de objeto múltiple (reguladas y no reguladas).","ref":"SEGUNDO, fr. IX"},{"id":"L144","tema":"bcd","tipo":"memoria","q":"¿Cuándo corresponde la evaluación «Cumple Mayoritariamente» según el OCTAVO B?","a":"Cuando la eficacia no puede ser completamente demostrada con el cumplimiento de las obligaciones","o":["Cuando el incumplimiento actualiza una sanción","Cuando la eficacia no puede ser demostrada por no contar con evidencia objetiva que permita demostrarla","Cuando el requisito no surte vigencia debido a las características estructurales, legales o institucionales del sujeto","Cuando la eficacia no puede ser completamente demostrada con el cumplimiento de las obligaciones"],"x":"El numeral 2 define Cumple Mayoritariamente como el caso en que la eficacia no puede ser completamente demostrada.","ref":"OCTAVO B, num. 2"},{"id":"L145","tema":"lin","tipo":"caso","q":"Durante la auditoría, el consejo de una unión de crédito ofrece al auditor externo integrarse como consejero al terminar el trabajo, y él acepta. ¿Qué requisito del CUARTO se ve afectado?","a":"Fr. V: no ser ni tener ofrecimiento para ser consejero o directivo","o":["Fr. VIII: no tener suspensión vigente de registro de auditor","Fr. VII: no tener litigio pendiente con el Sujeto Supervisado","Fr. IV: no estar inhabilitado en el sistema financiero","Fr. V: no ser ni tener ofrecimiento para ser consejero o directivo"],"x":"La fr. V del CUARTO exige no ser ni tener ofrecimiento para ser consejero o directivo del Sujeto Supervisado; aceptar la oferta durante la auditoría actualiza el impedimento.","ref":"CUARTO, fr. V"},{"id":"L146","tema":"lin","tipo":"caso","q":"El Auditor que firmará el Informe de un transmisor de dinero fue auditor interno de ese mismo transmisor hasta cuatro meses antes de que su despacho firmara el contrato. ¿Qué concluye el QUINTO?","a":"No hay independencia: fue auditor interno del sujeto en el año inmediato anterior al contrato","o":["Hay independencia, porque ya no forma parte de la estructura del transmisor","Hay independencia, porque la excepción para auditor interno del CUARTO lo permite","No hay independencia: fue auditor interno del sujeto en el año inmediato anterior al contrato","No hay independencia, salvo que la Comisión dispense el requisito"],"x":"El QUINTO, fr. I, inc. a), i), considera no independiente a quien haya sido auditor interno del Sujeto Supervisado en el año inmediato anterior al contrato. La excepción del CUARTO para el auditor interno aplica cuando el propio auditor interno elabora el Informe, no cuando se contrata a una Persona Moral externa.","ref":"QUINTO, fr. I, inc. a), i)"},{"id":"L147","tema":"bcd","tipo":"caso","q":"Con base en su juicio profesional, un auditor detecta irregularidades en una casa de cambio que podrían favorecer la comisión del delito del art. 400 Bis del CPF. ¿Qué establece el OCTAVO C?","a":"Se considera preocupante y se describe en la sección de Asuntos clave","o":["Sólo es preocupante si la Comisión lo confirma","Se considera preocupante y se describe en la sección de Asuntos clave","Sólo es preocupante si existe sentencia firme","Debe omitirse del Informe, porque sólo la autoridad penal puede calificar la posible comisión del delito"],"x":"El OCTAVO C considera preocupante detectar irregularidades que, con base en juicio profesional, pudieran favorecer los delitos de los arts. 139 Quáter o 400 Bis del CPF; en caso de requerirse, el Auditor desarrollará la sección de Asuntos clave con esos aspectos.","ref":"OCTAVO C, párr. segundo"},{"id":"L148","tema":"bcd","tipo":"caso","q":"Un Informe enlista un hallazgo en la obligación de capacitación, pero en la sección D no le asocia acción correctiva alguna. ¿Qué exige el OCTAVO D?","a":"Que los hallazgos se incluyan con su correspondiente acción o acciones correctivas","o":["Que se sustituya el hallazgo por una recomendación de mejora","Que el hallazgo se traslade a la sección de Asuntos clave de la auditoría en lugar de la sección D","Nada, la acción correctiva sólo es obligatoria en No cumple","Que los hallazgos se incluyan con su correspondiente acción o acciones correctivas"],"x":"El OCTAVO D pide incluir los hallazgos con su correspondiente acción o acciones correctivas.","ref":"OCTAVO D, párr. primero"},{"id":"L149","tema":"lin","tipo":"caso","q":"El escrito de remisión de un banco identifica al Auditor como «J. L. Pérez R.» e incluye número y fecha de su Certificado. ¿Cumple el DÉCIMO PRIMERO?","a":"No, debe asentarse el nombre completo sin abreviaturas del Auditor","o":["Sí, porque el número de Certificado ya identifica al Auditor","Sí, basta con las iniciales si se anexa la carta bajo protesta","No, debe asentarse el nombre completo sin abreviaturas del Auditor","No, debe incluirse además la cédula profesional del Auditor"],"x":"El DÉCIMO PRIMERO pide el nombre completo sin abreviaturas del Auditor designado, así como número y fecha de su Certificado.","ref":"DÉCIMO PRIMERO, párr. segundo"},{"id":"L150","tema":"lin","tipo":"caso","q":"Un transmisor de dinero con fuerte operación de remesas desde el extranjero tiene una metodología de evaluación de Riesgos que no pondera la zona geográfica. ¿Para qué le sirve al Auditor su propio análisis de Riesgos?","a":"Para verificar que la metodología del sujeto sea coherente con sus características","o":["Para verificar que la metodología del sujeto sea coherente con sus características","Sólo para calendarizar actividades, sin evaluar la metodología","Para sustituir, durante el periodo revisado, la metodología de evaluación de Riesgos que aplica el sujeto","Para reclasificar directamente el Grado de Riesgo de los Clientes"],"x":"El SEXTO añade que el análisis de Riesgos del Auditor debe servirle para verificar que la metodología de evaluación de Riesgos del sujeto es coherente con sus características.","ref":"SEXTO, párr. final"},{"id":"L151","tema":"bcd","tipo":"caso","q":"Una SOFIPO afirma que analiza las operaciones que no se dictaminan como inusuales, pero no conserva registro alguno de ese análisis y el auditor no obtiene evidencia objetiva. ¿Qué evaluación y contenido mínimo corresponden?","a":"Cumple Parcialmente, con al menos un hallazgo en la obligación evaluada","o":["Cumple Parcialmente, con al menos un hallazgo en la obligación evaluada","No aplica, verificando que sea consistente con el análisis de Riesgos","Cumple Mayoritariamente, con al menos una recomendación de mejora","Cumple, porque la afirmación del sujeto basta como sustento"],"x":"El OCTAVO B, num. 3, prevé Cumple Parcialmente cuando no hay evidencia objetiva y exige al menos un hallazgo.","ref":"OCTAVO B, num. 3"},{"id":"L152","tema":"lin","tipo":"caso","q":"El Informe de un banco lo elabora y firma su auditor interno, que es funcionario y empleado del propio banco. ¿Contraviene la fr. VI del CUARTO?","a":"No, ese requisito no es aplicable al auditor interno del propio Sujeto Supervisado","o":["Sí, ningún funcionario o empleado del Sujeto Supervisado puede firmar el Informe","No, ese requisito no es aplicable al auditor interno del propio Sujeto Supervisado","Sí, salvo que renuncie a su cargo antes de firmar el Informe","No, siempre que el Comité lo designe como Oficial de Cumplimiento interino"],"x":"La fr. VI del CUARTO prohíbe ser funcionario o empleado del Sujeto Supervisado, pero aclara que no es aplicable para su auditor interno.","ref":"CUARTO, fr. VI, párr. segundo"},{"id":"L153","tema":"lin","tipo":"caso","q":"El contrato entre una casa de bolsa y un despacho prevé un bono adicional si el Informe no califica ninguna obligación como «No cumple». ¿Cómo lo trata el QUINTO?","a":"No hay independencia: los ingresos dependen del resultado del propio Informe","o":["Es válido si el Comité aprueba el esquema de honorarios","No hay independencia: los ingresos dependen del resultado del propio Informe","Sólo afecta la independencia si el bono se paga antes de emitir el Informe","Es válido si el bono no excede los honorarios base pactados"],"x":"El QUINTO, fr. I, inc. b), considera que no hay independencia si los ingresos de la Persona Moral dependen del resultado del propio Informe.","ref":"QUINTO, fr. I, inc. b)"},{"id":"L154","tema":"bcd","tipo":"trampa","q":"¿Cuál de las siguientes situaciones NO está prevista en el OCTAVO C como supuesto preocupante?","a":"Que el Sujeto Supervisado cambie de Persona Moral auditora respecto del año anterior","o":["Que existan hallazgos que se sitúen en alguna infracción grave en términos de las Leyes aplicables","Que las medidas implementadas no sean acordes a los servicios, productos u Operaciones que ofrece","Que operativamente no haya eficacia en los controles","Que el Sujeto Supervisado cambie de Persona Moral auditora respecto del año anterior"],"x":"El OCTAVO C prevé cuatro supuestos: medidas no acordes, controles no eficaces, hallazgos de infracción grave e irregularidades que pudieran favorecer los delitos.","ref":"OCTAVO C, párr. segundo"},{"id":"L156","tema":"lin","tipo":"caso","q":"Una casa de bolsa escanea el Informe firmado y lo sube a SITI PLD/FT como PDF de imagen, en el que no se puede seleccionar ni buscar texto. ¿Cumple el DÉCIMO PRIMERO?","a":"No, el PDF debe permitir la selección del texto y la búsqueda de datos","o":["No, el Informe debe enviarse en formato de procesador de textos","Sí, siempre que el escaneo conserve la firma autógrafa","No, el PDF debe permitir la selección del texto y la búsqueda de datos","Sí, cualquier PDF es válido siempre que se cargue a través del SITI PLD/FT"],"x":"El DÉCIMO PRIMERO exige PDF con configuración de accesibilidad que permita la selección del texto y búsqueda de datos en el contenido.","ref":"DÉCIMO PRIMERO, párr. cuarto"},{"id":"L157","tema":"bcd","tipo":"caso","q":"En una obligación calificada «Cumple Parcialmente», el auditor sólo formuló dos recomendaciones de mejora, sin hallazgo. ¿Qué falta según el OCTAVO B?","a":"Al menos un hallazgo identificado en la obligación evaluada","o":["Nada, las recomendaciones de mejora son suficientes","La opinión del Oficial de Cumplimiento sobre la obligación","Al menos un hallazgo identificado en la obligación evaluada","Una tercera recomendación de mejora"],"x":"El OCTAVO B, num. 3, obliga a incluir al menos un hallazgo y, en su caso, una o más recomendaciones de mejora.","ref":"OCTAVO B, num. 3"},{"id":"L158","tema":"lin","tipo":"caso","q":"Un auditor externo presta servicios profesionales por honorarios, sin relación laboral, como apoderado de la misma casa de cambio que auditará. ¿Cumple la fr. VI del CUARTO?","a":"No, la prohibición aplica con independencia del régimen laboral","o":["No, la prohibición aplica con independencia del régimen laboral","Sí, porque un apoderado no forma parte de los órganos de gobierno","Sí, porque sólo se prohíbe a quien tenga relación laboral subordinada","No, pero sólo si además es accionista de la casa de cambio"],"x":"La fr. VI del CUARTO impide ser apoderado o empleado del Sujeto Supervisado con independencia del régimen laboral bajo el que se presten los servicios.","ref":"CUARTO, fr. VI"},{"id":"L159","tema":"lin","tipo":"caso","q":"Un despacho pacta con una institución de financiamiento colectivo cobrar un porcentaje adicional si esta obtiene una línea de fondeo que solicitará con base en el Informe de Auditoría. ¿Hay independencia?","a":"No, sus ingresos dependerían del éxito de una actividad sustentada en el Informe","o":["Sí, porque el fondeo es una actividad ajena al régimen PLD/FT","No, sus ingresos dependerían del éxito de una actividad sustentada en el Informe","No, pero sólo si el porcentaje supera la mitad de los honorarios","Sí, porque los honorarios no dependen del resultado del Informe en sí, sino de una actividad posterior"],"x":"El QUINTO, fr. I, inc. b), incluye ingresos que dependan del éxito de cualquier actividad del Sujeto Supervisado que tenga como sustento el Informe.","ref":"QUINTO, fr. I, inc. b)"},{"id":"L160","tema":"bcd","tipo":"memoria","q":"En el supuesto de irregularidades que pudieran favorecer delitos, ¿con base en qué las detecta el Auditor según el OCTAVO C?","a":"Con base en su juicio profesional","o":["Con base en su juicio profesional","Con base en una resolución previa de la UIF","Con base en la opinión del Oficial de Cumplimiento","Con base en una denuncia presentada ante el Ministerio Público"],"x":"El OCTAVO C se refiere a irregularidades que, con base en el juicio profesional del Auditor, pudieran favorecer la comisión de los delitos.","ref":"OCTAVO C, párr. segundo"},{"id":"L161","tema":"bcd","tipo":"cifra","q":"¿De qué periodo son las observaciones de la Comisión cuyo seguimiento debe reportarse, en su caso, en la sección D?","a":"Del año inmediato anterior","o":["Del año inmediato anterior","De los últimos dos años","Del periodo desde la última visita, sin límite","De los últimos cinco años"],"x":"El OCTAVO D se refiere a observaciones, recomendaciones o acciones correctivas formuladas por la Comisión en el año inmediato anterior.","ref":"OCTAVO D, párr. tercero"},{"id":"L162","tema":"bcd","tipo":"memoria","q":"¿Qué distingue la evaluación «Cumple Parcialmente» de «Cumple Mayoritariamente» en el OCTAVO B?","a":"En Cumple Parcialmente la eficacia no se demuestra por falta de evidencia objetiva","o":["En Cumple Parcialmente la obligación no surte vigencia para el sujeto","En Cumple Parcialmente no se permite incluir recomendaciones de mejora, sólo hallazgos identificados","En Cumple Parcialmente el incumplimiento siempre actualiza una sanción","En Cumple Parcialmente la eficacia no se demuestra por falta de evidencia objetiva"],"x":"El num. 2 se refiere a eficacia no completamente demostrada; el num. 3, a eficacia no demostrada por no contar con evidencia objetiva.","ref":"OCTAVO B, num. 2 y 3"},{"id":"L163","tema":"lin","tipo":"caso","q":"Un auditor tiene en curso una demanda contra la SOFIPO que lo contrata, por un adeudo de honorarios de otro servicio. ¿Qué requisito del CUARTO se incumple?","a":"Fr. VII: no tener litigio pendiente con el Sujeto Supervisado","o":["Fr. III: no haber sido sentenciado por delitos patrimoniales","Fr. IX: no estar en listas oficiales de personas vinculadas","Fr. V: no tener ofrecimiento para ser directivo","Fr. VII: no tener litigio pendiente con el Sujeto Supervisado"],"x":"La fr. VII del CUARTO exige no tener litigio pendiente con el Sujeto Supervisado.","ref":"CUARTO, fr. VII"},{"id":"L164","tema":"lin","tipo":"memoria","q":"¿Quién es responsable del cumplimiento de los requisitos de independencia del QUINTO, fr. I?","a":"El Sujeto Supervisado","o":["La Persona Moral contratada","La Comisión, al recibir el Informe","El Auditor que firma el Informe","El Sujeto Supervisado"],"x":"La fr. I del QUINTO dispone que el Sujeto Supervisado será responsable del cumplimiento de los requisitos de independencia.","ref":"QUINTO, fr. I, último párrafo"},{"id":"L165","tema":"bcd","tipo":"memoria","q":"¿En qué sentido de evaluación el OCTAVO B prevé expresamente incluir al menos un hallazgo y, en su caso, una o más recomendaciones de mejora?","a":"Cumple Parcialmente","o":["No aplica","Cumple","Cumple Parcialmente","Cumple Mayoritariamente"],"x":"El num. 3 (Cumple Parcialmente) exige al menos un hallazgo y, en su caso, recomendaciones; Cumple Mayoritariamente exige al menos una recomendación y, en su caso, hallazgo.","ref":"OCTAVO B, num. 3"},{"id":"L166","tema":"lin","tipo":"caso","q":"Un auditor tiene suspendido, con suspensión vigente, su registro para fungir como auditor externo independiente, aunque su Certificado CNBV sigue vigente. ¿Puede firmar el Informe?","a":"No, la fr. VIII del CUARTO exige no tener suspensión vigente de dicho registro","o":["No, pero sólo si la
